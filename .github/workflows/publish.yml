name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: node -e "const p=require('./package.json'),s=require('./server.json'); if ('v'+p.version!==process.env.GITHUB_REF_NAME || s.name!==p.mcpName || s.version!==p.version || s.packages[0].identifier!==p.name || s.packages[0].version!==p.version) process.exit(1)"
      - run: npm ci
      - run: npm run check
      - name: Install MCP Registry publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher validate server.json
      - run: npm publish --access public
      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json
